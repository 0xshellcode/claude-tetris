<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema claro/oscuro" title="Alternar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box menu-box">
        <p id="pause-title">PAUSA</p>

        <div id="pause-main" class="menu-view">
          <button class="menu-btn primary" data-action="resume">Reanudar</button>
          <button class="menu-btn" data-action="restart">Reiniciar</button>
          <button class="menu-btn" data-action="controls">Ver controles</button>

          <div class="level-picker">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-stepper">
              <button class="step-btn" data-action="level-down" aria-label="Bajar nivel inicial">◀</button>
              <span id="start-level" class="value" aria-live="polite">1</span>
              <button class="step-btn" data-action="level-up" aria-label="Subir nivel inicial">▶</button>
            </div>
            <span class="menu-hint"><kbd>←</kbd><kbd>→</kbd> cambiar · se aplica al reiniciar</span>
          </div>
        </div>

        <div id="pause-controls" class="menu-view hidden">
          <ul class="menu-controls">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <button class="menu-btn" data-action="back">Volver</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
